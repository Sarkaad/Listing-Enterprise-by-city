<title>Listing Entreprises</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b2430; --muted:#5d6b7c; --line:#d9dee5; --panel:#fff; --accent:#0b5fff; --code-bg:#0f1720; --code-fg:#dbe4ee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#10151c; --fg:#e6ebf1; --muted:#98a5b5; --line:#2a3441; --panel:#18202a; --accent:#6c9bff; --code-bg:#0a0f15; --code-fg:#dbe4ee; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#10151c; --fg:#e6ebf1; --muted:#98a5b5; --line:#2a3441; --panel:#18202a; --accent:#6c9bff; --code-bg:#0a0f15; --code-fg:#dbe4ee; color-scheme: dark; }
  body { background:var(--bg); color:var(--fg); padding-inline:16px; padding-block:20px; }
  .wrap { max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px; }
  h1 { font-size:20px; margin:0; }
  .step { color:var(--muted); font-size:13px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; padding:7px 14px; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:6px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  iframe { width:100%; height:480px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .file { min-width:0; }
  .file h2 { font:600 13px ui-monospace,Menlo,monospace; margin:12px 0 4px; color:var(--muted); }
  pre { margin:0; padding:12px; background:var(--code-bg); color:var(--code-fg); border-radius:8px; overflow-x:auto; font:12.5px/1.5 ui-monospace,Menlo,monospace; }
</style>
<div class="wrap">
  <header><h1>Listing Entreprises</h1><span class="step">Étape 1 : squelette, données factices</span></header>
  <nav>
    <button id="t-render" aria-pressed="true">Rendu</button>
    <button id="t-code" aria-pressed="false">Code</button>
  </nav>
  <section id="render"><iframe src="app/index.html" title="Rendu de l'application"></iframe></section>
  <section id="code" hidden></section>
</div>
<script>
  const files = ["app/index.html", "app/style.css", "app/app.js"];
  const $ = id => document.getElementById(id);
  function show(tab) {
    $("render").hidden = tab !== "render"; $("code").hidden = tab !== "code";
    $("t-render").setAttribute("aria-pressed", tab === "render");
    $("t-code").setAttribute("aria-pressed", tab === "code");
  }
  $("t-render").onclick = () => show("render");
  $("t-code").onclick = () => show("code");
  (async () => {
    for (const f of files) {
      const box = document.createElement("div"); box.className = "file";
      const h = document.createElement("h2"); h.textContent = f.replace("app/", "");
      const pre = document.createElement("pre");
      try { pre.textContent = await (await fetch(f)).text(); } catch { pre.textContent = "Fichier indisponible."; }
      box.append(h, pre); $("code").append(box);
    }
  })();
</script>
