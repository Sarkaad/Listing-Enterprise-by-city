<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entreprises par ville</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Entreprises par ville</h1>
    <label for="city">Ville</label>
    <input id="city" list="city-options" placeholder="Tapez le nom d'une ville…" autocomplete="off">
    <datalist id="city-options"></datalist>
    <div id="google-autocomplete" hidden></div>
    <p id="error" role="alert" hidden></p>
    <section id="selected" hidden>
      <h2 id="selected-name"></h2>
      <p id="selected-detail"></p>
    </section>
    <p id="status" hidden></p>
    <ol id="results"></ol>
  </main>
  <script src="config.js" onerror="void 0"></script>
  <script src="cities.js"></script>
  <script src="businesses.js"></script>
  <script src="app.js"></script>
</body>
</html>
